<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071126"/>
      <stop offset="45%" stop-color="#0e234e"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#3b82f6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border highlight -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.2"/>

  <!-- Glowing Luxury M Monogram -->
  <g filter="url(#subtleGlow)">
    <!-- Elegant stylized Mavluy Serif 'M' -->
    <path d="M 14 47 L 19 47 L 22.5 24.5 L 23 24.5 L 31.5 45 L 34.5 45 L 43 24.5 L 43.5 24.5 L 40.5 47 L 45.5 47 L 49 20 L 43 20 L 33 41 L 32.5 41 L 23 20 L 16.5 20 Z" fill="url(#mGrad)"/>
    
    <!-- Accent Luxury Sapphire Diamond on top right -->
    <circle cx="49.5" cy="16.5" r="4" fill="url(#blueAccent)"/>
    <circle cx="49.5" cy="16.5" r="1.8" fill="#ffffff"/>
  </g>
</svg>
