    <script>
      (function() {
        const originalLog = console.log;
        const originalWarn = console.warn;
        const originalError = console.error;
        const originalInfo = console.info;
        const originalDebug = console.debug;
        const filterVite = (args) => {
          for (let i = 0; i < args.length; i++) {
            const msg = args[i];
            if (!msg) continue;
            const str = typeof msg === 'string' ? msg : String(msg.message || msg.stack || msg);
            if (
              str.includes('[vite]') ||
              str.includes('WebSocket') ||
              str.includes('websocket') ||
              str.includes('Service Worker') ||
              str.includes('An empty string ("") was passed to the')
            ) {
              return true;
            }
          }
          return false;
        };
        console.log = function(...args) {
          if (filterVite(args)) return;
          originalLog.apply(console, args);
        };
        console.info = function(...args) {
          if (filterVite(args)) return;
          originalInfo.apply(console, args);
        };
        console.debug = function(...args) {
          if (filterVite(args)) return;
          originalDebug.apply(console, args);
        };
        console.warn = function(...args) {
          if (filterVite(args)) return;
          originalWarn.apply(console, args);
        };
        console.error = function(...args) {
          if (filterVite(args)) return;
          originalError.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function(event) {
          const reason = event.reason ? String(event.reason.message || event.reason) : '';
          if (reason.includes('WebSocket') || reason.includes('vite') || reason.includes('websocket') || reason.includes('opened')) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          const msg = event.message ? String(event.message) : '';
          if (msg.includes('WebSocket') || msg.includes('vite') || msg.includes('websocket') || msg.includes('opened')) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>

    <script>
      // Save original console functions
      const originalConsoleError = console.error;
      const originalConsoleWarn = console.warn;

      // Filter function to check if log should be ignored
      function shouldIgnore(args) {
        for (let i = 0; i < args.length; i++) {
          const arg = args[i];
          if (typeof arg === 'string' && (
            arg.includes('[vite]') || 
            arg.includes('WebSocket') || 
            arg.includes('websocket') || 
            arg.includes('WebSocket closed')
          )) {
            return true;
          }
          if (arg && typeof arg === 'object' && arg.message && typeof arg.message === 'string' && (
            arg.message.includes('[vite]') || 
            arg.message.includes('WebSocket') || 
            arg.message.includes('websocket') || 
            arg.message.includes('WebSocket closed')
          )) {
            return true;
          }
        }
        return false;
      }

      console.error = function(...args) {
        if (shouldIgnore(args)) return;
        originalConsoleError.apply(console, args);
      };

      console.warn = function(...args) {
        if (shouldIgnore(args)) return;
        originalConsoleWarn.apply(console, args);
      };

      // Filter out benign and harmless HMR/WebSocket connection attempts from polluting the developer logs
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          event.reason.message === 'WebSocket closed without opened.' ||
          (typeof event.reason === 'string' && event.reason.includes('WebSocket')) ||
          (event.reason.message && event.reason.message.includes('WebSocket')) ||
          (event.reason.message && event.reason.message.includes('websocket'))
        )) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
      window.addEventListener('error', function(event) {
        if (event.message && (
          event.message.includes('WebSocket') || 
          event.message.includes('websocket') || 
          event.message.includes('failed to connect to websocket')
        )) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);

      // Register Progressive Web App Service Worker for Background Notifications
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            console.log('Mavluy Service Worker Registered:', reg);
          }).catch(err => {
            console.error('Mavluy Service Worker Registration failed:', err);
          });
        });
      }
    </script>
